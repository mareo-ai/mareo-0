name: Windows build

# Builds the signed Squirrel installer on a Windows runner, so no local Windows
# machine is needed. Trigger it from the Actions tab; the installer is attached
# as a downloadable artifact.
#
# Signing runs through the sslTrus remote signing service (the certificate has no
# UKey), so the build needs the repository secrets
#   SSLTRUS_ACCESS_KEY      access key of the code-signing subscription
#   SSLTRUS_ACCESS_SECRET   its secret
#   SSLTRUS_CERT_CODE       which certificate to sign with (see docs/signing.md)
# and fails rather than publishing an unsigned installer.

on:
  workflow_dispatch:

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Squirrel unpacks the app under the output directory, and Windows refuses
      # paths past 260 characters. The checkout path plus out/make/squirrel...
      # lands at 264; a two-character root leaves room for the runtime's deepest
      # file (186 characters on its own).
      MAREO_OUT_DIR: C:\m
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned Node runtime for Windows
        run: npm run check:node:win

      - name: Install the signing CLI
        shell: pwsh
        env:
          ACCESS_KEY: ${{ secrets.SSLTRUS_ACCESS_KEY }}
          ACCESS_SECRET: ${{ secrets.SSLTRUS_ACCESS_SECRET }}
          SSLTRUS_CERT_CODE: ${{ secrets.SSLTRUS_CERT_CODE }}
        run: ./scripts/install-signing-cli.ps1

      - name: Build installer
        shell: pwsh
        env:
          ACCESS_KEY: ${{ secrets.SSLTRUS_ACCESS_KEY }}
          ACCESS_SECRET: ${{ secrets.SSLTRUS_ACCESS_SECRET }}
          SSLTRUS_CERT_CODE: ${{ secrets.SSLTRUS_CERT_CODE }}
          # Squirrel unpacks the package under %TEMP% before building the
          # installer, and the runner's temp path is 38 characters
          # (C:\Users\RUNNER~1\AppData\Local\Temp). The runtime's deepest file
          # adds 174 more, which is what exceeds 260 — not the output directory.
          # .NET reads TMP before TEMP, so a two-character root buys 33.
          TEMP: C:\t
          TMP: C:\t
        run: |
          New-Item -ItemType Directory -Force -Path C:\t | Out-Null
          npm run make:win

      - name: Verify the signatures
        shell: pwsh
        run: ./scripts/verify-windows-signatures.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MareoSetup-windows-x64
          path: ${{ env.MAREO_OUT_DIR }}/make/squirrel.windows/x64/MareoSetup.exe
          if-no-files-found: error
          retention-days: 30
