<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'" />
    <title>Mareo</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: Canvas;
        color: CanvasText;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        display: grid;
        justify-items: center;
        gap: 18px;
      }

      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid color-mix(in srgb, CanvasText 18%, transparent);
        border-top-color: CanvasText;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      p {
        margin: 0;
        font-size: 14px;
        opacity: 0.72;
      }

      /* Startup can take a while on a busy machine. Say so after a few seconds —
         with CSS only, so the page keeps its script-free CSP. */
      .slow {
        opacity: 0;
        animation: reveal 0.4s ease 8s forwards;
      }

      @media (prefers-reduced-motion: reduce) {
        .slow {
          opacity: 0.72;
          animation: none;
        }
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes reveal {
        to { opacity: 0.72; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="logo-white.png" alt="Mareo" width="96" height="96" />
      <div class="spinner" aria-hidden="true"></div>
      <p>正在启动引擎…</p>
      <p class="slow">首次启动或系统繁忙时可能要等一会儿，引擎会自动重试，请不要关闭窗口。</p>
    </main>
  </body>
</html>
