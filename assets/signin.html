<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'"
    />
    <title>登录 Mareo</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
        --background: #fafbff;
        --surface: #ffffff;
        --text: #202238;
        --muted: #71768b;
        --border: #dde1ed;
        --accent: #5752d9;
        --accent-hover: #4944c2;
        --tint: #efeffb;
        --focus: #5752d926;
        --error: #b83445;
        --success: #247456;
        background: var(--background);
        color: var(--text);
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 28px 24px;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 50% 0%, var(--tint), transparent 65%);
      }

      main {
        width: min(100%, 344px);
      }

      header { text-align: center; margin-bottom: 32px; }
      header img { display: block; margin: 0 auto 16px; }
      h1 { margin: 0; font-size: 26px; line-height: 1.4; font-weight: 600; letter-spacing: -0.7px; }
      p.hint { margin: 9px 0 0; color: var(--muted); font-size: 13px; line-height: 1.7; }

      section {
        display: flex;
        flex-direction: column;
        gap: 18px;
        min-height: 342px;
      }
      .row { display: grid; gap: 8px; text-align: left; }
      label { font-size: 13px; font-weight: 500; line-height: 20px; }
      .code-row { display: grid; grid-template-columns: minmax(0, 1fr) 140px; gap: 10px; }

      input {
        width: 100%;
        min-width: 0;
        height: 46px;
        padding: 12px 14px;
        font-size: 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        color: var(--text);
        font-family: inherit;
        transition: border-color 150ms, box-shadow 150ms;
      }
      input::placeholder { color: var(--muted); opacity: 1; }
      input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--focus);
      }
      #code { font-variant-numeric: tabular-nums; }

      button {
        min-height: 46px;
        padding: 12px 14px;
        font-size: 14px;
        font-weight: 550;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font-family: inherit;
        transition: background 150ms, box-shadow 150ms;
      }
      button:hover:not(:disabled) { background: var(--accent-hover); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      button:disabled { opacity: 0.6; cursor: default; }
      .primary { width: 100%; box-shadow: 0 3px 9px var(--focus); }
      button.send {
        background: var(--tint);
        color: var(--accent);
        border: 1px solid var(--border);
        white-space: nowrap;
        padding: 10px 8px;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      button.send:hover:not(:disabled) { background: var(--focus); }
      button.link {
        align-self: center;
        margin-top: auto;
        min-height: 32px;
        padding: 6px 10px;
        font-size: 13px;
        font-weight: 400;
        background: transparent;
        color: var(--muted);
      }
      button.link:hover { background: var(--tint); color: var(--accent); }
      p.status {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.65;
        min-height: 44px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      p.status.error { color: var(--error); }
      p.status.ok { color: var(--success); }
      p.status.warn { color: var(--muted); font-weight: 600; }
      .token-hint { margin: 0; font-size: 13px; line-height: 1.7; color: var(--muted); }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #191a24;
          --surface: #232531;
          --text: #eeedf7;
          --muted: #a1a6bc;
          --border: #3c3f53;
          --accent: #a6a0ff;
          --accent-hover: #bbb6ff;
          --tint: #2b2942;
          --focus: #a6a0ff26;
          --error: #ff9aa8;
          --success: #87d7b6;
        }
        .primary { color: #201d3b; }
      }
      @media (prefers-reduced-motion: reduce) {
        input, button { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="logo.png" alt="" width="64" height="64" />
        <h1>欢迎使用 Mareo</h1>
        <p class="hint">登录你的账号，让想法继续向前。</p>
      </header>

      <section id="email-mode">
        <div class="row">
          <label for="email">邮箱</label>
          <input id="email" type="email" placeholder="name@example.com" autocomplete="email" spellcheck="false" />
        </div>
        <div class="row">
          <label for="code">验证码</label>
          <div class="code-row">
            <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="6 位验证码" autocomplete="one-time-code" />
            <button id="send-code" class="send" type="button">发送验证码</button>
          </div>
        </div>
        <div class="field" id="invite-field" hidden>
          <label for="invite">邀请码</label>
          <input id="invite" type="text" maxlength="8" placeholder="8 位邀请码，可不填" autocomplete="off" spellcheck="false" />
        </div>
        <button class="link" id="show-invite" type="button">有邀请码？</button>
        <button id="email-sign-in" class="primary" type="button">登录 Mareo</button>
        <p class="status" id="email-status" role="status"></p>
        <button class="link" style="display: none;" id="show-token" type="button">使用访问令牌登录</button>
      </section>

      <section id="token-mode" hidden>
        <div class="row">
          <label for="token">访问令牌</label>
          <input id="token" type="password" placeholder="粘贴你的访问令牌" autocomplete="off" spellcheck="false" />
        </div>
        <p class="token-hint">使用管理员提供的访问令牌登录。<br>已有邮箱账号？可切回邮箱验证码登录。</p>
        <button id="token-sign-in" class="primary" type="button">登录 Mareo</button>
        <p class="status" id="token-status" role="status"></p>
        <button class="link" id="show-email" type="button">返回邮箱验证码登录</button>
      </section>
      <p class="hint" style="margin-top: 18px;">
        继续即表示同意
        <a href="https://mareo.cn/privacy.html" target="_blank" rel="noreferrer">《隐私说明》</a>。
        登录后可在「设置 → 账户」中关闭诊断统计。广告展示与点击统计独立记录，并关联用户 ID，详见隐私说明。
      </p>
    </main>
    <script>
      const emailInput = document.getElementById('email')
      const codeInput = document.getElementById('code')
      const sendButton = document.getElementById('send-code')
      const signInButton = document.getElementById('email-sign-in')
      const inviteField = document.getElementById('invite-field')
      const inviteInput = document.getElementById('invite')
      const showInvite = document.getElementById('show-invite')
      const emailStatus = document.getElementById('email-status')
      const emailMode = document.getElementById('email-mode')
      const tokenMode = document.getElementById('token-mode')
      const tokenInput = document.getElementById('token')
      const tokenSignIn = document.getElementById('token-sign-in')
      const tokenStatus = document.getElementById('token-status')

      function setStatus(element, text, kind) {
        element.textContent = text
        element.className = 'status' + (kind ? ' ' + kind : '')
      }

      sendButton.addEventListener('click', async () => {
        const email = emailInput.value.trim()
        if (!email.includes('@')) {
          setStatus(emailStatus, '请输入正确的邮箱地址。', 'error')
          return
        }
        sendButton.disabled = true
        setStatus(emailStatus, '正在发送…')
        const result = await window.mareo.sendCode(email)
        if (result.ok) {
          setStatus(emailStatus, '验证码已发送，请查收邮箱（5 分钟内有效）。', 'ok')
          codeInput.focus()
          let remaining = 60
          const tick = setInterval(() => {
            remaining -= 1
            if (remaining > 0) {
              sendButton.textContent = '重新发送（' + remaining + 's）'
            } else {
              clearInterval(tick)
              sendButton.textContent = '发送验证码'
              sendButton.disabled = false
            }
          }, 1000)
        } else {
          sendButton.disabled = false
          setStatus(emailStatus, result.error ?? '发送失败，请稍后重试。', 'error')
        }
      })

      showInvite.addEventListener('click', () => {
        inviteField.hidden = false
        showInvite.hidden = true
        inviteInput.focus()
      })

      signInButton.addEventListener('click', async () => {
        const email = emailInput.value.trim()
        const code = codeInput.value.trim()
        if (!email.includes('@') || code.length < 6) {
          setStatus(emailStatus, '请输入邮箱和 6 位验证码。', 'error')
          return
        }
        signInButton.disabled = true
        setStatus(emailStatus, '正在登录…')
        const inviteCode = inviteField.hidden ? '' : inviteInput.value.trim()
        const result = await window.mareo.emailSignIn(email, code, inviteCode)
        if (result.ok) {
          // The main process waits for this notice before closing, so a rejected
          // invite code is visible instead of vanishing with the window.
          setStatus(emailStatus, result.notice || '登录成功，正在启动…', result.notice ? 'warn' : 'ok')
        } else {
          signInButton.disabled = false
          setStatus(emailStatus, result.error ?? '登录失败，请重试。', 'error')
        }
      })

      document.getElementById('show-token').addEventListener('click', () => {
        emailMode.hidden = true
        tokenMode.hidden = false
        tokenInput.focus()
      })
      document.getElementById('show-email').addEventListener('click', () => {
        tokenMode.hidden = true
        emailMode.hidden = false
        emailInput.focus()
      })

      tokenSignIn.addEventListener('click', async () => {
        const token = tokenInput.value.trim()
        if (!token) {
          setStatus(tokenStatus, '请输入访问令牌。', 'error')
          return
        }
        tokenSignIn.disabled = true
        setStatus(tokenStatus, '正在登录…')
        const result = await window.mareo.signIn(token)
        if (result.ok) {
          setStatus(tokenStatus, '登录成功，正在启动…', 'ok')
        } else {
          tokenSignIn.disabled = false
          setStatus(tokenStatus, result.error ?? '登录失败，请重试。', 'error')
        }
      })

      emailInput.addEventListener('keydown', (event) => { if (event.key === 'Enter') sendButton.click() })
      codeInput.addEventListener('keydown', (event) => { if (event.key === 'Enter') signInButton.click() })
      emailInput.focus()
    </script>
  </body>
</html>
